<!-- Feedback-modal — include op pagina's met een 💬 Feedback-knop in de navbar (onclick="fbOpen()") -->
<div id="fb-modal" onclick="if(event.target===this)fbClose()"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1200;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);padding:1.4rem 1.5rem;width:420px;max-width:92vw">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem">
      <div style="font-weight:700;color:var(--gray-900)">💬 Feedback sturen</div>
      <button onclick="fbClose()" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--gray-400);line-height:1">✕</button>
    </div>
    <div style="font-size:.8125rem;color:var(--gray-500);margin-bottom:.75rem">Feedback gaat rechtstreeks naar Ronny.</div>
    <textarea id="fb-bericht" placeholder="Wat wil je kwijt?" rows="4" maxlength="2000"
              style="width:100%;box-sizing:border-box;padding:.55rem .7rem;border:1.5px solid var(--gray-200);border-radius:9px;font-size:.875rem;font-family:inherit;resize:vertical;margin-bottom:.7rem"></textarea>
    <div style="display:flex;gap:.5rem;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="fbClose()">Annuleren</button>
      <button class="btn btn-primary btn-sm" onclick="fbSubmit()">Versturen</button>
    </div>
    <div id="fb-status" style="font-size:.8125rem;min-height:1rem;margin-top:.5rem"></div>
  </div>
</div>
<script>
  function fbOpen() {
    document.getElementById('fb-bericht').value = '';
    document.getElementById('fb-status').textContent = '';
    document.getElementById('fb-modal').style.display = 'flex';
    setTimeout(function(){ document.getElementById('fb-bericht').focus(); }, 50);
  }
  function fbClose() { document.getElementById('fb-modal').style.display = 'none'; }
  function fbSubmit() {
    var bericht = (document.getElementById('fb-bericht').value || '').trim();
    var st = document.getElementById('fb-status');
    if (!bericht) { st.textContent = 'Vul een bericht in.'; st.style.color = 'var(--red)'; return; }
    st.textContent = 'Versturen…'; st.style.color = 'var(--gray-500)';
    fetch('/api/feedback', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bericht: bericht })
    }).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res) {
        if (!res.ok) { st.textContent = res.d.detail || 'Versturen mislukt.'; st.style.color = 'var(--red)'; return; }
        st.textContent = '✔ Verstuurd!'; st.style.color = 'var(--green)';
        setTimeout(fbClose, 1200);
      })
      .catch(function(){ st.textContent = 'Versturen mislukt.'; st.style.color = 'var(--red)'; });
  }
</script>
