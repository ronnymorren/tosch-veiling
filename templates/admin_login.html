<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen – Tosch Veiling</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-body">
  <nav class="navbar">
    <a href="/" class="nav-brand"><img src="/static/tosch-logo.png" alt="Tosch" class="nav-logo"></a>
  </nav>

  <div class="page-center">
    <div class="card" style="max-width:380px;width:100%;text-align:center">
      <img src="/static/tosch-logo.png" alt="Tosch" style="height:40px;margin-bottom:1.25rem">
      <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:.375rem">Beheerder inloggen</h2>
      <p style="color:var(--gray-500);font-size:.9rem;margin-bottom:1.5rem">Vul het beheerderswachtwoord in</p>

      {% if error %}
      <div class="alert alert-error" style="text-align:left;margin-bottom:1rem">{{ error }}</div>
      {% endif %}

      <form method="post" action="/admin/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group" style="text-align:left">
          <label>Wachtwoord</label>
          <input type="password" name="password" placeholder="••••••••" autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">
          Inloggen →
        </button>
      </form>
    </div>
  </div>
</body>
</html>
