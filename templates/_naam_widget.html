{# Naam-widget: 👋 naam + ✏️ inline bewerken. Verwacht `user` in de context. #}
{% if user %}
<span id="naam-display" title="Klik om naam te wijzigen"
      style="color:var(--gray-500);font-size:.875rem;cursor:pointer;white-space:nowrap"
      onclick="naamBewerken()">👋 <span id="naam-tekst">{{ user.naam }}</span> ✏️</span>
<span id="naam-edit" style="display:none;align-items:center;gap:.4rem">
  <input id="naam-input" type="text" value="{{ user.naam }}"
         style="width:140px;padding:.3rem .6rem;font-size:.875rem;border:1.5px solid var(--gray-200);border-radius:8px;font-family:inherit"
         maxlength="80" onkeydown="if(event.key==='Enter')naamOpslaan();if(event.key==='Escape')naamAnnuleren()">
  <button class="btn btn-primary btn-sm" onclick="naamOpslaan()">Opslaan</button>
  <button class="btn btn-ghost btn-sm" onclick="naamAnnuleren()">✕</button>
</span>
<script>
  function naamBewerken() {
    document.getElementById('naam-display').style.display = 'none';
    const edit = document.getElementById('naam-edit');
    edit.style.display = 'flex';
    const inp = document.getElementById('naam-input');
    inp.focus();
    inp.select();
  }
  function naamAnnuleren() {
    document.getElementById('naam-edit').style.display = 'none';
    document.getElementById('naam-display').style.display = '';
  }
  async function naamOpslaan() {
    const inp  = document.getElementById('naam-input');
    const naam = inp.value.trim();
    if (!naam) return;
    try {
      const r = await fetch('/api/profiel/naam', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ naam })
      });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        alert(d.detail || 'Opslaan mislukt');
        return;
      }
      document.getElementById('naam-tekst').textContent = naam;
      naamAnnuleren();
    } catch {
      alert('Fout bij opslaan. Probeer opnieuw.');
    }
  }
</script>
{% endif %}
